        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto text-center">
            <li class="nav-item">

            </li>

      </div>

  <main>
    <section class="contacto-texto" aria-label="Información de contacto">
      <h2>Podés contactarme por:</h2>
      <ul>
        <li class="nav-li">
          <a href="https://github.com/Orionsbelt-jpg" target="_blank" rel="noopener noreferrer">GitHub</a>
        </li>
        <li class="nav-li">Discord: 0rionsbelt_</li>
      </ul>

      <form class="contacto-form" aria-label="Formulario de contacto">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu mensaje..." required></textarea>

        <button type="submit">Enviar</button>
        <p class="form-disclaimer">Formulario de demostración — para escribirme de verdad, usá GitHub o Discord de arriba. ↑</p>
      </form>
    </section>

<aside class="sidebar">
